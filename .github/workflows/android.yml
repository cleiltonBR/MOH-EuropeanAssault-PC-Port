name: Android ARM64 bootstrap and generated-code validation

on:
  push:
    branches: [android-port]
    paths:
      - "android/**"
      - "source/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      MOH_PRIVATE_REPO_TOKEN: ${{ secrets.MOH_PRIVATE_REPO_TOKEN }}
    steps:
      - name: Checkout Android port
        uses: actions/checkout@v4

      - name: Require private generated game sources
        run: |
          if [ -z "$MOH_PRIVATE_REPO_TOKEN" ]; then
            echo "::error::MOH_PRIVATE_REPO_TOKEN is required to validate generated game code."
            exit 1
          fi

      - name: Checkout private generated game code
        uses: actions/checkout@v4
        with:
          repository: cleiltonBR/MOH-EuropeanAssault-Private
          ref: main
          token: ${{ secrets.MOH_PRIVATE_REPO_TOKEN }}
          path: private-generated
          persist-credentials: false

      - name: Prepare generated game sources
        run: |
          test -f private-generated/recompilation.zip
          mkdir -p "$RUNNER_TEMP/moh-recomp"
          unzip -q private-generated/recompilation.zip -d "$RUNNER_TEMP/moh-recomp"
          GEN_HEADER="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_funcs.h -print -quit)"
          test -n "$GEN_HEADER"
          GEN_DIR="$(dirname "$GEN_HEADER")"
          test -f "$GEN_DIR/recomp_types.h"
          DISPATCH_FILE="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_dispatch.c -print -quit)"
          STUBS_FILE="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_stubs_unresolved.c -print -quit)"
          test -n "$DISPATCH_FILE"
          test -n "$STUBS_FILE"
          test "$(dirname "$DISPATCH_FILE")" = "$(dirname "$STUBS_FILE")"
          echo "RECOMP_GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"
          echo "RECOMP_ROOT_DIR=$(dirname "$DISPATCH_FILE")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build ARM64 APK and compile generated game archive
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Inspect generated-code link dependencies (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/recomp-linkage-report.txt"
          {
            echo "Generated recompilation linkage inventory"
            echo "This report contains symbol metadata only; no source code or build logs."
            echo
            echo "All extracted C/C++ source and header files:"
            find "$RUNNER_TEMP/moh-recomp" -type f \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' \) -printf '%P\n' | sort
            echo
            echo "Symbols referenced by generated archive but not defined inside it:"
            ARCHIVE="$(find android/app/.cxx -type f -name 'libmoh_generated_recomp_arm64.a' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "Generated archive not found"
              exit 1
            fi
            NM="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
            test -n "$NM"
            "$NM" --undefined-only "$ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/recomp-undefined.txt"
            "$NM" --defined-only "$ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/recomp-defined.txt"

            # Account for the Android kernel archive already built by this
            # project. This separates symbols the existing runtime can supply
            # from genuinely missing Android/runtime or game implementations.
            KERNEL_ARCHIVE="$(find android/app/.cxx -type f -name 'libxbox_kernel.a' -print -quit)"
            if [ -z "$KERNEL_ARCHIVE" ]; then
              echo "Android xbox_kernel archive not found"
              exit 1
            fi
            "$NM" --defined-only "$KERNEL_ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/kernel-defined.txt"
            cat "$RUNNER_TEMP/recomp-defined.txt" "$RUNNER_TEMP/kernel-defined.txt" | sort -u > "$RUNNER_TEMP/recomp-runtime-defined.txt"
            comm -23 "$RUNNER_TEMP/recomp-undefined.txt" "$RUNNER_TEMP/recomp-runtime-defined.txt" > "$RUNNER_TEMP/recomp-external.txt"
            comm -23 "$RUNNER_TEMP/recomp-undefined.txt" "$RUNNER_TEMP/recomp-defined.txt" > "$RUNNER_TEMP/recomp-outside-generated.txt"
            comm -23 "$RUNNER_TEMP/recomp-outside-generated.txt" "$RUNNER_TEMP/kernel-defined.txt" > "$RUNNER_TEMP/recomp-not-in-kernel.txt"
            echo "Unique undefined references across objects: $(wc -l < "$RUNNER_TEMP/recomp-undefined.txt")"
            echo "Symbols defined inside generated archive: $(wc -l < "$RUNNER_TEMP/recomp-defined.txt")"
            echo "Symbols supplied by existing Android kernel archive: $(wc -l < "$RUNNER_TEMP/kernel-defined.txt")"
            echo "Remaining external symbols after generated + kernel definitions: $(wc -l < "$RUNNER_TEMP/recomp-external.txt")"
            echo
            echo "Remaining external symbols (runtime libraries or missing implementations):"
            cat "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Symbols not generated internally and not supplied by xbox_kernel:"
            cat "$RUNNER_TEMP/recomp-not-in-kernel.txt"
            echo
            echo "Classification of remaining external symbols:"
            while IFS= read -r symbol; do
              case "$symbol" in
                recomp_*) group="recompilation runtime support" ;;
                sub_*) group="game-specific translated function / missing generated body" ;;
                __*) group="compiler or C runtime" ;;
                *) group="Android libc/libm candidate" ;;
              esac
              printf '%-48s %s\\n' "$group" "$symbol"
            done < "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Generated archive object(s) referencing each remaining symbol:"
            "$NM" -A --undefined-only "$ARCHIVE" > "$RUNNER_TEMP/recomp-undefined-by-object.txt"
            while IFS= read -r symbol; do
              echo "[$symbol]"
              grep -F " $symbol" "$RUNNER_TEMP/recomp-undefined-by-object.txt" || true
            done < "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Source-tree occurrence inventory for unresolved symbols (paths and counts only):"
            python3 - "$RUNNER_TEMP/moh-recomp" "$RUNNER_TEMP/recomp-external.txt" "$RECOMP_ROOT_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          generated_root = pathlib.Path(sys.argv[3])
          symbols = pathlib.Path(sys.argv[2]).read_text().splitlines()
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c", ".h", ".cc", ".cpp", ".hpp"}]
          for symbol in symbols:
              hits = []
              pattern = re.compile(r"\b" + re.escape(symbol) + r"\b")
              for path in files:
                  try:
                      data = path.read_text(errors="ignore")
                  except OSError:
                      continue
                  count = len(pattern.findall(data))
                  if count:
                      hits.append(f"{path.relative_to(root)} ({count})")
              print(f"[{symbol}] " + ("; ".join(hits) if hits else "not present in extracted source tree"))
          print("Runtime helper declarations (declaration lines only):")
          helpers = {"recomp_icall_fail_log", "recomp_icall_not_code_log", "recomp_lookup_manual", "recomp_unimpl"}
          for header in generated_root.rglob("*.h"):
              try:
                  for line_no, line in enumerate(header.read_text(errors="ignore").splitlines(), 1):
                      if any(re.search(r"\b" + re.escape(name) + r"\b", line) for name in helpers):
                          print("{}:{}: {}".format(header.relative_to(root), line_no, line.strip()))
              except OSError:
                  pass
          PY
            echo
            echo "Dispatcher and entry-point declarations:"
            grep -R -n -E 'xbe_entry_point|recomp_dispatch_init|recomp_lookup' "$RECOMP_ROOT_DIR" --include='*.h' --include='*.c' | sed -E 's#^([^:]+):[0-9]+:#\1:#' | sort -u || true
          } > "$REPORT"
          mkdir -p android/recomp-linkage-report
          cp "$REPORT" android/recomp-linkage-report/linkage.txt

      - name: Upload generated-code linkage inventory
        uses: actions/upload-artifact@v4
        with:
          name: moh-generated-code-linkage-inventory
          path: android/recomp-linkage-report/linkage.txt
          if-no-files-found: error
      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moh-european-assault-android-arm64-debug-generated-code-validated
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  test-sse-compat-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Compile SSE compatibility tests for Android ARM64
        run: |
          NDK_CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$NDK_CLANG" -std=c11 -Wall -Wextra -Werror -fsyntax-only android/app/src/main/cpp/recomp_sse_compat_test.c

  test-sse-compat-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ARM64 SSE compatibility tests with strict warnings
        run: |
          cc -std=c11 -Wall -Wextra -Werror android/app/src/main/cpp/recomp_sse_compat_test.c -lm -o /tmp/recomp_sse_compat_test

      - name: Run SSE compatibility behavior tests
        run: /tmp/recomp_sse_compat_test
