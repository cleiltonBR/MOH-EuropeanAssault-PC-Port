name: Android ARM64 bootstrap and generated-code validation

on:
  push:
    branches: [android-port]
    paths:
      - "android/**"
      - "source/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      MOH_PRIVATE_REPO_TOKEN: ${{ secrets.MOH_PRIVATE_REPO_TOKEN }}
    steps:
      - name: Checkout Android port
        uses: actions/checkout@v4

      - name: Require private generated game sources
        run: |
          if [ -z "$MOH_PRIVATE_REPO_TOKEN" ]; then
            echo "::error::MOH_PRIVATE_REPO_TOKEN is required to validate generated game code."
            exit 1
          fi

      - name: Checkout private generated game code
        uses: actions/checkout@v4
        with:
          repository: cleiltonBR/MOH-EuropeanAssault-Private
          ref: main
          token: ${{ secrets.MOH_PRIVATE_REPO_TOKEN }}
          path: private-generated
          persist-credentials: false

      - name: Prepare generated game sources
        run: |
          test -f private-generated/recompilation.zip
          mkdir -p "$RUNNER_TEMP/moh-recomp"
          unzip -q private-generated/recompilation.zip -d "$RUNNER_TEMP/moh-recomp"
          GEN_HEADER="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_funcs.h -print -quit)"
          test -n "$GEN_HEADER"
          GEN_DIR="$(dirname "$GEN_HEADER")"
          test -f "$GEN_DIR/recomp_types.h"
          DISPATCH_FILE="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_dispatch.c -print -quit)"
          STUBS_FILE="$(find "$RUNNER_TEMP/moh-recomp" -type f -name recomp_stubs_unresolved.c -print -quit)"
          test -n "$DISPATCH_FILE"
          test -n "$STUBS_FILE"
          test "$(dirname "$DISPATCH_FILE")" = "$(dirname "$STUBS_FILE")"
          echo "RECOMP_GEN_DIR=$GEN_DIR" >> "$GITHUB_ENV"
          echo "RECOMP_ROOT_DIR=$(dirname "$DISPATCH_FILE")" >> "$GITHUB_ENV"

      - name: Audit generated calls that may pass raw Xbox pointers to libc
        shell: bash
        run: |
          python3 - "$RECOMP_ROOT_DIR" "$RUNNER_TEMP/raw-pointer-call-audit.txt" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          apis = {
              "memcpy", "memmove", "memset", "memcmp", "memchr",
              "strlen", "strnlen", "strcpy", "strncpy", "strcat",
              "strncat", "strcmp", "strncmp", "strchr", "strrchr",
              "strstr", "strtok", "sprintf", "snprintf", "vsprintf",
              "vsnprintf", "sscanf", "fputs", "puts", "printf",
              "fprintf", "vfprintf"
          }
          call_re = re.compile(r"\\b(" + "|".join(sorted(apis, key=len, reverse=True)) + r")\\s*\\(")
          ptr_re = re.compile(r"(?:g_(?:eax|ecx|edx|ebx|esi|edi|esp|ebp)|\\b[a-zA-Z_]\\w*(?:_va|_ptr|_addr|_buffer|_buf)\\b|\\(\\s*(?:const\\s+)?(?:void|char|uint8_t|uint16_t|uint32_t|uintptr_t)\\s*\\*|\\bMEM(?:8|16|32|64)\\s*\\()")
          translated_re = re.compile(r"XBOX_PTR|g_xbox_mem_offset|\\b_mo\\b")
          rows = []
          for path in sorted(root.rglob("*")):
              if path.suffix.lower() not in {".c", ".h", ".cc", ".cpp", ".hpp"}:
                  continue
              try:
                  lines = path.read_text(errors="ignore").splitlines()
              except OSError:
                  continue
              for n, line in enumerate(lines, 1):
                  for m in call_re.finditer(line):
                      # Keep only likely guest-pointer arguments and exclude
                      # explicit guest-to-host translations in the same call.
                      tail = line[m.end():]
                      arg = tail.split(",", 1)[0].split(")", 1)[0]
                      if ptr_re.search(arg) and not translated_re.search(arg):
                          rows.append(f"{path.relative_to(root)}:{n}: {m.group(1)}: first argument resembles an unconverted guest pointer")
          out.write_text("\\n".join(rows) + ("\\n" if rows else "No obvious raw guest-pointer libc callsites found.\\n"))
          print(f"Raw-pointer libc callsite candidates: {len(rows)}")
          print(out.read_text())
          PY
          mkdir -p android/raw-pointer-call-audit
          cp "$RUNNER_TEMP/raw-pointer-call-audit.txt" android/raw-pointer-call-audit/candidates.txt

      - name: Upload raw-pointer callsite audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moh-raw-pointer-callsite-audit
          path: android/raw-pointer-call-audit/candidates.txt
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Separate native CMake/NDK compilation from Gradle packaging. This
      # identifies which stage fails without collecting or exposing build logs.
      - name: Compile native ARM64 runtime and generated game archive
        run: gradle --no-daemon -p android :app:externalNativeBuildDebug

      - name: Isolate native CMake targets after failure
        if: failure()
        shell: bash
        run: |
          set +e
          REPORT="$RUNNER_TEMP/native-target-diagnostics.txt"
          : > "$REPORT"
          echo "Native CMake target isolation (exit codes only; no build logs)" >> "$REPORT"
          mapfile -t BUILD_FILES < <(find android/app/.cxx -type f -name build.ninja -print 2>/dev/null)
          if [ "${#BUILD_FILES[@]}" -eq 0 ]; then
            echo "No configured CMake/Ninja build directory found" >> "$REPORT"
          fi
          for BUILD_FILE in "${BUILD_FILES[@]}"; do
            BUILD_DIR="$(dirname "$BUILD_FILE")"
            echo "Build directory: ${BUILD_DIR#android/app/.cxx/}" >> "$REPORT"
            for TARGET in platform xbox_apu xbox_kernel xbox_d3d8 moh_generated_recomp_arm64; do
              cmake --build "$BUILD_DIR" --target "$TARGET" --parallel 2 >/dev/null 2>&1
              RESULT=$?
              printf '%-32s exit=%s\\n' "$TARGET" "$RESULT" >> "$REPORT"
            done
            python3 - "$BUILD_DIR" "$REPORT" <<'PY'
          import json, pathlib, shlex, subprocess, sys
          build = pathlib.Path(sys.argv[1])
          report = pathlib.Path(sys.argv[2])
          db_path = build / "compile_commands.json"
          entries = json.loads(db_path.read_text()) if db_path.exists() else []
          native = [e for e in entries if pathlib.Path(e["file"]).name == "native_entry.cpp"]
          if not native:
              with report.open("a") as out:
                  out.write("native_entry.cpp compile command not found\\n")
          for entry in native:
              command = entry.get("arguments") or shlex.split(entry["command"])
              p = subprocess.run(command, cwd=entry["directory"], text=True,
                                 stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              with report.open("a") as out:
                  out.write(f"native_entry.cpp compile exit={p.returncode}\\n")
                  for line in p.stdout.splitlines():
                      if any(x in line.lower() for x in ("error:", "fatal error:", "undefined reference", "no such file")):
                          out.write("  " + line[:500] + "\\n")
          p = subprocess.run(["cmake", "--build", str(build), "--target", "moh_android", "--parallel", "2"],
                             text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          with report.open("a") as out:
              out.write(f"moh_android target build/link exit={p.returncode}\\n")
              for line in p.stdout.splitlines():
                  low = line.lower()
                  if any(x in low for x in ("undefined symbol", "undefined reference", "multiple definition",
                                            "cannot find", "error:", "ld.lld:", "clang++:", "ninja: build stopped")):
                      out.write("  " + line[:500] + "\\n")
          PY
          done
          for ARCHIVE in android/app/.cxx/Debug/*/arm64-v8a/*.a; do
            [ -f "$ARCHIVE" ] && printf 'archive-present %s bytes=%s\n' "$ARCHIVE" "$(stat -c %s "$ARCHIVE")" >> "$REPORT"
          done
          cat "$REPORT"
          mkdir -p android/native-target-diagnostics
          cp "$REPORT" android/native-target-diagnostics/targets.txt

      - name: Upload native target diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moh-native-target-diagnostics
          path: android/native-target-diagnostics/targets.txt
          if-no-files-found: ignore

      - name: Package ARM64 debug APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Inspect generated-code link dependencies (metadata only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/recomp-linkage-report.txt"
          {
            echo "Generated recompilation linkage inventory"
            echo "This report contains symbol metadata only; no source code or build logs."
            echo
            echo "All extracted C/C++ source and header files:"
            find "$RUNNER_TEMP/moh-recomp" -type f \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' -o -name '*.hpp' \) -printf '%P\n' | sort
            echo
            echo "Symbols referenced by generated archive but not defined inside it:"
            ARCHIVE="$(find android/app/.cxx -type f -name 'libmoh_generated_recomp_arm64.a' -print -quit)"
            if [ -z "$ARCHIVE" ]; then
              echo "Generated archive not found"
              exit 1
            fi
            NM="$(find "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt" -type f -name llvm-nm -print -quit)"
            test -n "$NM"
            "$NM" --undefined-only "$ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/recomp-undefined.txt"
            "$NM" --defined-only "$ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/recomp-defined.txt"

            # Account for the Android kernel archive already built by this
            # project. This separates symbols the existing runtime can supply
            # from genuinely missing Android/runtime or game implementations.
            KERNEL_ARCHIVE="$(find android/app/.cxx -type f -name 'libxbox_kernel.a' -print -quit)"
            if [ -z "$KERNEL_ARCHIVE" ]; then
              echo "Android xbox_kernel archive not found"
              exit 1
            fi
            : > "$RUNNER_TEMP/runtime-defined-all.txt"
            for ARCHIVE_NAME in libplatform.a libxbox_apu.a libxbox_kernel.a libxbox_d3d8.a; do
              RUNTIME_ARCHIVE="$(find android/app/.cxx -type f -name "$ARCHIVE_NAME" -print -quit)"
              if [ -n "$RUNTIME_ARCHIVE" ]; then
                "$NM" --defined-only "$RUNTIME_ARCHIVE" | awk '{print $NF}' >> "$RUNNER_TEMP/runtime-defined-all.txt"
              fi
            done
            sort -u "$RUNNER_TEMP/runtime-defined-all.txt" > "$RUNNER_TEMP/runtime-defined.txt"
            "$NM" --defined-only "$KERNEL_ARCHIVE" | awk '{print $NF}' | sort -u > "$RUNNER_TEMP/kernel-defined.txt"
            cat "$RUNNER_TEMP/recomp-defined.txt" "$RUNNER_TEMP/runtime-defined.txt" | sort -u > "$RUNNER_TEMP/recomp-runtime-defined.txt"
            comm -23 "$RUNNER_TEMP/recomp-undefined.txt" "$RUNNER_TEMP/recomp-runtime-defined.txt" > "$RUNNER_TEMP/recomp-external.txt"
            comm -23 "$RUNNER_TEMP/recomp-undefined.txt" "$RUNNER_TEMP/recomp-defined.txt" > "$RUNNER_TEMP/recomp-outside-generated.txt"
            comm -23 "$RUNNER_TEMP/recomp-outside-generated.txt" "$RUNNER_TEMP/kernel-defined.txt" > "$RUNNER_TEMP/recomp-not-in-kernel.txt"
            echo "Unique undefined references across objects: $(wc -l < "$RUNNER_TEMP/recomp-undefined.txt")"
            echo "Symbols defined inside generated archive: $(wc -l < "$RUNNER_TEMP/recomp-defined.txt")"
            echo "Symbols supplied by Android static runtime archives: $(wc -l < "$RUNNER_TEMP/runtime-defined.txt")"
            echo "Remaining external symbols after generated + kernel definitions: $(wc -l < "$RUNNER_TEMP/recomp-external.txt")"
            echo
            echo "Remaining external symbols (runtime libraries or missing implementations):"
            cat "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Symbols not generated internally and not supplied by xbox_kernel:"
            cat "$RUNNER_TEMP/recomp-not-in-kernel.txt"
            echo
            echo "Classification of remaining external symbols:"
            while IFS= read -r symbol; do
              case "$symbol" in
                recomp_*) group="recompilation runtime support" ;;
                sub_*) group="game-specific translated function / missing generated body" ;;
                __*) group="compiler or C runtime" ;;
                *) group="Android libc/libm candidate" ;;
              esac
              printf '%-48s %s\\n' "$group" "$symbol"
            done < "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Generated archive object(s) referencing each remaining symbol:"
            "$NM" -A --undefined-only "$ARCHIVE" > "$RUNNER_TEMP/recomp-undefined-by-object.txt"
            while IFS= read -r symbol; do
              echo "[$symbol]"
              grep -F " $symbol" "$RUNNER_TEMP/recomp-undefined-by-object.txt" || true
            done < "$RUNNER_TEMP/recomp-external.txt"
            echo
            echo "Source-tree occurrence inventory for unresolved symbols (paths and counts only):"
            python3 - "$RUNNER_TEMP/moh-recomp" "$RUNNER_TEMP/recomp-external.txt" "$RECOMP_ROOT_DIR" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          generated_root = pathlib.Path(sys.argv[3])
          symbols = pathlib.Path(sys.argv[2]).read_text().splitlines()
          files = [p for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".c", ".h", ".cc", ".cpp", ".hpp"}]
          for symbol in symbols:
              hits = []
              pattern = re.compile(r"\b" + re.escape(symbol) + r"\b")
              for path in files:
                  try:
                      data = path.read_text(errors="ignore")
                  except OSError:
                      continue
                  count = len(pattern.findall(data))
                  if count:
                      hits.append(f"{path.relative_to(root)} ({count})")
              print(f"[{symbol}] " + ("; ".join(hits) if hits else "not present in extracted source tree"))
          print("Runtime helper declarations (declaration lines only):")
          helpers = {"recomp_icall_fail_log", "recomp_icall_not_code_log", "recomp_lookup_manual", "recomp_unimpl"}
          for header in generated_root.rglob("*.h"):
              try:
                  for line_no, line in enumerate(header.read_text(errors="ignore").splitlines(), 1):
                      if any(re.search(r"\b" + re.escape(name) + r"\b", line) for name in helpers):
                          print("{}:{}: {}".format(header.relative_to(root), line_no, line.strip()))
              except OSError:
                  pass
          PY
            echo
            echo "Dispatcher and entry-point declarations:"
            grep -R -n -E 'xbe_entry_point|recomp_dispatch_init|recomp_lookup' "$RECOMP_ROOT_DIR" --include='*.h' --include='*.c' | sed -E 's#^([^:]+):[0-9]+:#\1:#' | sort -u || true
          } > "$REPORT"
          mkdir -p android/recomp-linkage-report
          cp "$REPORT" android/recomp-linkage-report/linkage.txt

      - name: Upload generated-code linkage inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moh-generated-code-linkage-inventory
          path: android/recomp-linkage-report/linkage.txt
          if-no-files-found: error
      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moh-european-assault-android-arm64-debug-generated-code-validated
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  test-apu-runtime-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Configure Android ARM64 runtime targets
        run: |
          cmake -S android/app/src/main/cpp -B "$RUNNER_TEMP/moh-apu-arm64" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMOH_BUILD_GENERATED_RECOMP=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Compile APU source apu_core.c (ARM64)
        env:
          APU_SOURCE: apu_core.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_vp.c (ARM64)
        env:
          APU_SOURCE: apu_vp.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_dsp.c (ARM64)
        env:
          APU_SOURCE: apu_dsp.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_mmio_hook.c (ARM64)
        env:
          APU_SOURCE: apu_mmio_hook.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_xaudio2.c (ARM64)
        env:
          APU_SOURCE: apu_xaudio2.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_wav.c (ARM64)
        env:
          APU_SOURCE: apu_wav.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile APU source apu_aaudio.c (ARM64)
        env:
          APU_SOURCE: apu_aaudio.c
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shlex, subprocess, sys
          build = os.path.join(os.environ["RUNNER_TEMP"], "moh-apu-arm64")
          with open(os.path.join(build, "compile_commands.json")) as f:
              db = json.load(f)
          entry = next(e for e in db if pathlib.Path(e["file"]).name == os.environ["APU_SOURCE"])
          command = entry.get("arguments") or shlex.split(entry["command"])
          result = subprocess.run(command, cwd=entry["directory"],
                                  stdout=subprocess.DEVNULL,
                                  stderr=subprocess.DEVNULL)
          sys.exit(result.returncode)
          PY
      - name: Compile Android APU archive
        run: cmake --build "$RUNNER_TEMP/moh-apu-arm64" --target xbox_apu --parallel 2

  test-sse-compat-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Compile SSE compatibility tests for Android ARM64
        run: |
          NDK_CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          "$NDK_CLANG" -std=c11 -Wall -Wextra -Werror -fsyntax-only android/app/src/main/cpp/recomp_sse_compat_test.c

  test-sse-compat-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile ARM64 SSE compatibility tests with strict warnings
        run: |
          cc -std=c11 -Wall -Wextra -Werror android/app/src/main/cpp/recomp_sse_compat_test.c -lm -o /tmp/recomp_sse_compat_test

      - name: Run SSE compatibility behavior tests
        run: /tmp/recomp_sse_compat_test

      - name: Test POSIX fixed-address and partial guest-window mappings
        run: |
          cmake -S source/xboxrecomp-0.16.0/tests/win32_compat_posix \
            -B "$RUNNER_TEMP/win32-compat-posix"
          cmake --build "$RUNNER_TEMP/win32-compat-posix" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/win32-compat-posix" --output-on-failure

  test-aaudio-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Compile native AAudio backend for Android ARM64
        run: |
