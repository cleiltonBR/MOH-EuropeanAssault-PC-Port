name: Android manual hooks contract

on:
  push:
    branches:
      - android/manual-hooks-layer
    paths:
      - "android/manual_hooks/**"
      - ".github/workflows/android-manual-hooks.yml"
  pull_request:
    paths:
      - "android/manual_hooks/**"
      - ".github/workflows/android-manual-hooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    name: Host contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S android/manual_hooks -B build/manual-hooks -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/manual-hooks --parallel
      - name: Test
        run: ctest --test-dir build/manual-hooks --output-on-failure

  android-arm64:
    name: Android arm64-v8a compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Configure NDK target
        run: |
          cmake -S android/manual_hooks -B build/manual-hooks-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_TESTING=OFF
      - name: Compile ARM64 static library
        run: cmake --build build/manual-hooks-arm64 --parallel
